<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Romin</title>
    <style>
    body {
        background: radial-gradient(ellipse at center, #19203c 0%, #20152c 100%);      
        color: #ffffff;
        font-family: monospace;
        min-height: 100vh;
         margin: 0;
    }
    a{
        color: #ffffff;
        font-weight: bold;
    }
    li {
        margin-bottom: 10px;
        width:fit-content;
        font-size: 1.2em;
    }

    main {
        display: flex; /*Använder flexbox för att få elementen att ligga jämte varann och positionering*/
        justify-content: center;
        align-items: center;
    }

    /*Byt färg med animation på länkarna när musen är över*/
    a:hover {
        color: #ff0000;
        transition: all 0.3s ease;
    }

    section {
        margin-left: 50px;
        text-align: center;
    }
    .skills > li {
        list-style-type:square;
    }
    ul {
        padding-bottom: 30px;
    }
    .portrait {
        width: 250px;
        height: auto;
        border-radius: 20px;
        border: 2px solid #ffffff;
        display: inline-block;
    }
    h1 {
        font-size: 3.5em;
        margin-bottom: 10px;
        
    }
    
    header {
        text-align: center;
        padding: 20px;
    }


    footer {
        text-align: center;
        margin-top: 20vh;
    }
  
    a {
        font-size: 1.5em;
    }

    /*Lite responsivitet fixar typ*/
    @media screen and (max-width: 600px) {
    main {
        flex-direction: column;
    }
    
    section {
        margin-left: 0; 
    }
    }
    
    </style>
</head>
<body>
    <header>
        <h1>Marco Romin</h1>
    </header>
    <main>
                <img class="portrait" src="../images/marco_romin.jpg" alt="Marco Romin">
                    <section>
                        <h2>Saker jag är bra på:</h2>
                        <ul class="skills">
                            <li>Javascript</li>
                            <li>Design</li>
                            <li>Problemlösning</li>
                            <li>Datorspel</li>
                        </ul>
                        <a href="https://github.com/yaarco" target="_blank" rel="noopener noreferrer">
                                    Github
                                </a>
                    </section>
    </main>
    <footer>
        <a href="../index.html">Tillbaka till grupplista</a>
    </footer>
    
</body>
</html>
