<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Romin</title>
    <style>
    body {
        background: radial-gradient(ellipse at center, #19203c 0%, #20152c 100%);      
        color: #ffffff;
        font-family: monospace;
        min-height: 100vh;
         margin: 0;
    }
    a{
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
    }
    li {
        margin-bottom: 10px;
        width:fit-content;
        font-size: 1.2em;
    }


    main {
        display: flex; /*Använder flexbox för att få elementen att ligga jämte varann och positionering*/
        justify-content: center;
        align-items: center;
    }

    /*Lite responsivitet fixar typ*/
    @media screen and (max-width: 600px) {
    main {
        flex-direction: column;
    }
    
    section {
        margin-left: 0; 
    }
}
    
    /*Byt färg med animation på länkarna när musen är över*/
    li a:hover {
        color: #ff0000;
        transition: all 0.3s ease;
    }
    li a:hover svg {
        fill: #ff0000;
        transition: all 0.3s ease;
    }
    li a svg {
        vertical-align: middle;
        margin-bottom: 5px;
    }
    ul{
        width: fit-content;
    }
    section {
        margin-left: 50px;
    }
    .skills > li {
        margin-right: 30px;
    }
    .portrait {
        width: 250px;
        height: auto;
        border-radius: 20px;
        border: 2px solid #ffffff;
        display: inline-block;
    }
    h1 {
        font-size: 3.5em;
        margin-bottom: 10px;
        
    }
    
    header {
        text-align: center;
        padding: 20px;
    }
    .links {
        list-style-type: none;
        padding: 0;
        margin-left: 30px;
    }
    .links li {
        display: inline-block;
        margin-right: 20px;
    }
    svg {
        width: 30px;
        height: 30px;
        fill: #ffffff;
    }
    .info {
        vertical-align: center;
        margin-left: 20px;
    }


    
</style>
</head>
